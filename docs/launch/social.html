<!doctype html>
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
html,body{width:1280px;height:640px;overflow:hidden}
body{font-family:'Inter Display','Inter',-apple-system,sans-serif;color:#fff;background:#0d3d9a url(../../public/bruma-sky.jpg) center 40%/cover;position:relative}
body::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(6,28,84,.82) 0%,rgba(10,46,130,.55) 46%,rgba(20,80,180,.05) 75%)}
.wrap{position:relative;display:grid;grid-template-columns:600px 1fr;height:100%;padding:64px 72px}
.brand{display:flex;align-items:center;gap:16px;font-size:30px;font-weight:650;letter-spacing:-.02em}
.brand img{width:64px;height:64px;filter:drop-shadow(0 8px 18px rgba(0,20,80,.45))}
h1{margin-top:44px;font-size:84px;line-height:.98;font-weight:750;letter-spacing:-.045em}
h1 em{font-style:normal;color:#bfe0ff}
p.sub{margin-top:24px;font-size:25px;line-height:1.38;color:rgba(235,243,255,.9);font-weight:450;max-width:520px}
kbd{display:inline-grid;place-items:center;min-width:42px;height:34px;padding:0 9px;border-radius:9px;font:600 19px 'Inter',sans-serif;color:#0f1729;background:linear-gradient(#fff,#e4ebf5);box-shadow:0 2px 0 #a9b6cb,0 6px 14px -6px rgba(0,0,0,.4);vertical-align:2px}
.chips{display:flex;gap:10px;margin-top:34px}
.chip{padding:9px 16px;border-radius:999px;font-size:17px;font-weight:600;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(8px)}
.foot{position:absolute;left:72px;bottom:44px;font-size:17px;color:rgba(225,236,255,.75);font-weight:500;letter-spacing:.01em}
.stage{position:relative;align-self:center;justify-self:end;width:520px;height:330px}
.win{position:absolute;inset:0 0 70px 0;border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.94),rgba(244,248,253,.9));box-shadow:0 30px 70px -20px rgba(0,20,70,.6),inset 0 1px 0 #fff;color:#0f1729;padding:22px 26px;overflow:hidden}
.bar{display:flex;gap:8px;align-items:center}
.bar i{width:12px;height:12px;border-radius:50%}
.bar b{margin-left:14px;font-size:15px;color:#556072;font-weight:600}
.msg{margin-top:26px;display:flex;gap:12px;align-items:flex-end}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(#a9c8ff,#5d8fe8);flex:none}
.bubble{padding:12px 16px;border-radius:18px 18px 18px 6px;background:#e9eef6;font-size:18px;line-height:1.35}
.me{margin-top:16px;margin-left:auto;max-width:390px;padding:12px 16px;border-radius:18px 18px 6px 18px;background:linear-gradient(#3d93ff,#1667e0);color:#fff;font-size:18px;line-height:1.4;box-shadow:0 8px 20px -10px rgba(22,103,224,.8)}
.caret{display:inline-block;width:2px;height:20px;background:#fff;margin-left:2px;vertical-align:-3px}
.pill{position:absolute;left:50%;bottom:0;transform:translateX(-50%);display:flex;align-items:center;gap:12px;height:52px;padding:0 18px;border-radius:999px;background:linear-gradient(180deg,rgba(40,120,70,.95),rgba(12,40,24,.97));border:1px solid rgba(140,255,180,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 14px 30px -10px rgba(0,0,0,.6),0 0 26px 2px rgba(80,230,130,.45)}
.wave{display:flex;gap:5px;align-items:center;height:28px}
.wave span{width:5px;border-radius:3px;background:#d8ffe5;box-shadow:0 0 8px rgba(120,255,160,.7)}
.x{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:13px;color:#fff}
.stop{width:26px;height:26px;border-radius:50%;background:#fff;display:grid;place-items:center}
.stop i{width:9px;height:9px;border-radius:2px;background:#0f1729}
.live{position:absolute;left:50%;bottom:66px;transform:translateX(-50%);white-space:nowrap;font-size:15px;color:#fff;background:rgba(8,12,20,.78);padding:7px 14px;border-radius:12px;backdrop-filter:blur(6px)}
</style></head><body><div class="wrap">
<div>
  <div class="brand"><img src="../../public/bruma-icon-256.png" alt="">Bruma</div>
  <h1 id="h"></h1>
  <p class="sub" id="s"></p>
  <div class="chips" id="c"></div>
</div>
<div class="stage">
  <div class="win">
    <div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><b>WhatsApp</b></div>
    <div class="msg"><span class="av"></span><span class="bubble" id="q"></span></div>
    <div class="me" id="a"></div>
  </div>
  <div class="pill"><span class="x">✕</span><span class="wave"><span style="height:9px"></span><span style="height:16px"></span><span style="height:24px"></span><span style="height:28px"></span><span style="height:21px"></span><span style="height:14px"></span><span style="height:8px"></span></span><span class="stop"><i></i></span></div>
</div>
<div class="foot" id="f">github.com/yairhdz24/bruma</div>
</div>
<script>
const es = location.hash === '#es';
const t = es ? {
  h: 'Habla.<br><em>Bruma</em> escribe.',
  s: 'Teclado por voz gratis y de código abierto para Mac. Toca <kbd>fn</kbd>, habla y el texto aparece en cualquier app.',
  c: ['Gratis con Groq', 'Privada', 'Código abierto'],
  q: '¿Llegas a la junta de las 5?',
  a: 'Sí, llego como a las 5:15. ¿Me mandas el link del deck en Figma?<span class="caret"></span>',
  f: 'github.com/yairhdz24/bruma · Creada por Yair Hernández'
} : {
  h: 'Talk.<br><em>Bruma</em> types.',
  s: 'Free, open-source voice keyboard for Mac. Tap <kbd>fn</kbd>, speak, and clean text appears in any app.',
  c: ['Free with Groq', 'Private', 'Open source'],
  q: 'Are you joining the 5pm call?',
  a: 'Yes, I’ll be there around 5:15. Can you send me the Figma link for the deck?<span class="caret"></span>',
  f: 'github.com/yairhdz24/bruma · Made by Yair Hernández'
};
h.innerHTML = t.h; s.innerHTML = t.s; q.textContent = t.q; a.innerHTML = t.a; f.textContent = t.f;
c.innerHTML = t.c.map(x => `<span class="chip">${x}</span>`).join('');
</script></body></html>

name: Desktop builds
on:
  workflow_dispatch:
  push:
    branches: [main, 'bruma-*']
    tags: ['v*']
    paths-ignore: ['docs/**', '**.md', 'LICENSE', '.github/ISSUE_TEMPLATE/**']
  pull_request:
    paths-ignore: ['docs/**', '**.md', 'LICENSE', '.github/ISSUE_TEMPLATE/**']
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
            artifact: Bruma-macOS-Apple-Silicon
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact: Bruma-Windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci --no-audit --no-fund
      - name: Validate frontend
        run: npm run build
      - name: Verify macOS native helpers
        if: runner.os == 'macOS'
        run: |
          clang -fobjc-arc -framework AppKit -framework Foundation src-tauri/native/symbols.m src-tauri/native/symbols_test.m -o "$RUNNER_TEMP/bruma-symbol-test"
          "$RUNNER_TEMP/bruma-symbol-test"
          clang -fobjc-arc -fblocks -framework AppKit -framework Foundation -framework AVFoundation -framework ApplicationServices -framework CoreGraphics src-tauri/native/symbols.m src-tauri/native/context.m src-tauri/native/permissions.m src-tauri/native/paste.m src-tauri/native/context_permissions_test.m -o "$RUNNER_TEMP/bruma-context-test"
          "$RUNNER_TEMP/bruma-context-test"
      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
      - name: Build personal installer
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Archive macOS application
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent src-tauri/target/${{ matrix.target }}/release/bundle/macos/Bruma.app src-tauri/target/${{ matrix.target }}/release/bundle/Bruma-macOS.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          retention-days: 14
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/*.zip

  # A pushed tag such as v0.7.0 publishes the installers as a GitHub Release.
  release:
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Name the installers
        run: |
          mkdir release
          find dist -name '*.dmg' -exec cp {} "release/Bruma-${GITHUB_REF_NAME}-macOS-Apple-Silicon.dmg" \;
          find dist -name '*.exe' -exec cp {} "release/Bruma-${GITHUB_REF_NAME}-Windows-x64-setup.exe" \;
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true

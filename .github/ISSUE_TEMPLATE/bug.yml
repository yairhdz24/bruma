name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thanks! Please never paste API keys or personal text. Use sample data."
  - type: textarea
    id: what
    attributes:
      label: "What happened?"
      description: "Steps to reproduce and what you expected."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "Bruma version"
      placeholder: "0.7.0 (Ajustes → Acerca de)"
  - type: dropdown
    id: os
    attributes:
      label: "System"
      options: ["macOS (Apple Silicon)", "macOS (Intel)", "Windows"]
  - type: dropdown
    id: engine
    attributes:
      label: "Speech engine"
      options: ["Groq", "OpenAI", "Deepgram", "Your own server"]
